name: android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "scripts/build-xray-android.sh"
      - "scripts/build-awg.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Компоненты Android SDK
        run: |
          # На раннере SDK уже стоит: пользуемся им напрямую, потому что
          # setup-android тянет пакет tools, которого больше не существует.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Версия библиотеки AmneziaWG
        id: awg
        run: |
          SHA="$(git ls-remote https://github.com/amnezia-vpn/amneziawg-android HEAD | cut -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "AmneziaWG: $SHA"

      - name: Библиотека AmneziaWG из кэша
        id: awg-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/awg-tunnel.aar
          key: awg-aar-${{ steps.awg.outputs.sha }}

      - name: Собираю библиотеку AmneziaWG
        if: steps.awg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-awg.sh android/app/libs/awg-tunnel.aar

      - name: Проверяю библиотеку
        run: |
          AAR="android/app/libs/awg-tunnel.aar"
          if [ ! -f "$AAR" ]; then
            echo "Библиотека не появилась по пути $AAR" >&2
            find . -name "*.aar" | head >&2
            exit 1
          fi
          ls -lh "$AAR"
          echo "--- содержимое ---"
          unzip -l "$AAR" | grep -E "classes|\.so" | head -10 || true

      # ── X-Ray ────────────────────────────────────────────────────────
      # Своя обёртка (android/xraylib): xray и tun2socks одной библиотекой.
      # Ключ кэша — версии движков и сама обёртка: поменялось что-то из
      # этого — библиотека собирается заново.
      - name: Версии X-Ray
        id: xray
        run: |
          XRAY="$(git ls-remote --refs --tags https://github.com/XTLS/Xray-core.git 'v2*' | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          T2S="v2.7.0"
          WRAP="$(cat android/xraylib/xraylib.go android/xraylib/go.mod scripts/build-xray-android.sh | sha256sum | cut -c1-12)"
          echo "key=$XRAY-$T2S-$WRAP" >> "$GITHUB_OUTPUT"
          echo "xray $XRAY, tun2socks $T2S, обёртка $WRAP"

      - name: Библиотека X-Ray из кэша
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/xraylib.aar
          key: xraylib-${{ steps.xray.outputs.key }}

      - name: Собираю библиотеку X-Ray
        if: steps.xray-cache.outputs.cache-hit != 'true'
        run: |
          # Конец журнала при ошибке — ещё и в заметку к прогону: её видно,
          # не скачивая журнал целиком.
          set -o pipefail
          if ./scripts/build-xray-android.sh android/app/libs/xraylib.aar 2>&1 | tee /tmp/xraylib.log; then
            exit 0
          fi
          TEXT="$(grep -vE '^(go: (downloading|finding|extracting)|  )' /tmp/xraylib.log | tail -n 40 \
            | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Библиотека X-Ray не собралась::$TEXT"
          exit 1

      - name: Проверяю библиотеку X-Ray
        run: |
          AAR="android/app/libs/xraylib.aar"
          test -f "$AAR" || { echo "Библиотека X-Ray не появилась" >&2; exit 1; }
          ls -lh "$AAR"
          unzip -l "$AAR" | grep -E "\.so|classes" | head

      - name: Определить версию
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Проверочная сборка: номер выше выложенного, чтобы приложение
            # не предлагало «обновиться» до прежней версии и не стирало её.
            VERSION="3.1.0"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Тесты
        working-directory: android
        run: |
          # Полный лог Gradle — это тысячи строк стектрейса, в которых
          # сама ошибка теряется. Сохраняем его и при падении показываем
          # отдельно то, ради чего лог и открывают.
          set -o pipefail
          if gradle test --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-test.log; then
            exit 0
          fi
          echo
          echo "=============== что именно не собралось ==============="
          grep -E "^e: |^w: .*error|FAILED$" /tmp/gradle-test.log | head -40 || true
          echo "======================================================="
          exit 1

      - name: Сборка релизного APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PqpvpnVersion="${{ steps.version.outputs.value }}"

      - name: Проверяю манифест пакета
        run: |
          # Без объявленной службы VPN туннель не поднимется — проверяем,
          # что библиотека AmneziaWG принесла её в собранный манифест.
          MANIFEST="$(find android/app/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)"
          echo "манифест: $MANIFEST"
          echo "--- службы VPN ---"
          grep -o 'android:name="[^"]*VpnService"' "$MANIFEST" | sort -u
          if ! grep -q "BIND_VPN_SERVICE" "$MANIFEST"; then
            echo "В манифесте нет разрешения BIND_VPN_SERVICE — туннель не заработает." >&2
            exit 1
          fi
          echo "--- приём ссылок vpn:// ---"
          grep -o 'android:scheme="vpn"' "$MANIFEST" | head -1

      - name: Подготовить файлы
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          OUT="android/app/build/outputs/apk/release"
          ls -lh "$OUT"

          # Основная сборка — под arm64: это все телефоны, выпущенные
          # с 2015 года. Она вдвое легче универсальной, а качать её людям
          # приходится по каналу, который рвётся на больших файлах.
          MAIN="$OUT/app-arm64-v8a-release.apk"
          UNIVERSAL="$OUT/app-universal-release.apk"
          test -f "$MAIN"
          test -f "$UNIVERSAL"

          mkdir -p dist
          cp "$MAIN" "dist/QPVPN-$VERSION.apk"
          cp "$UNIVERSAL" "dist/QPVPN-$VERSION-universal.apk"
          echo "path=dist/QPVPN-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "universal=dist/QPVPN-$VERSION-universal.apk" >> "$GITHUB_OUTPUT"

          echo "--- что вышло ---"
          ls -lh dist/
          main_mb=$(( $(stat -c%s "dist/QPVPN-$VERSION.apk") / 1048576 ))
          universal_mb=$(( $(stat -c%s "dist/QPVPN-$VERSION-universal.apk") / 1048576 ))
          echo "::notice title=Размер APK::основной ${main_mb} МБ, универсальный ${universal_mb} МБ"
          # Порог был 20 МБ. С X-Ray он недостижим: сам движок даже урезанным
          # весит около 10 МБ в сжатом виде, у любого клиента X-Ray для
          # Android файл выходит в 25–35 МБ. Порог поднят осознанно, но
          # остаётся: если файл раздуется дальше, сборка это заметит.
          if [ "$main_mb" -gt 35 ]; then
            echo "Основной APK больше 35 МБ — по плохому каналу его не скачать." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: QPVPN-${{ steps.version.outputs.value }}-apk
          path: dist/*.apk
          if-no-files-found: error

      # Проверочная сборка — в отдельный выпуск android-proverka. Приложения
      # оттуда не обновляются: они смотрят только в latest. Это ссылка,
      # чтобы поставить сборку на свой телефон и проверить до выпуска.
      - name: Выложить проверочную сборку
        if: github.event_name == 'push' && github.ref_name == 'claude/mac-vpn-app-routes-7jv8o7'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.apk.outputs.path }}" dist/QPVPN-android-proverka.apk
          printf '%s' "${{ steps.version.outputs.value }}" > dist/android-proverka-version.txt
          if ! gh release view android-proverka >/dev/null 2>&1; then
            gh release create android-proverka --prerelease --target "$GITHUB_SHA" \
              --title "QP VPN для Android — проверочная сборка" \
              --notes "Сборка из ветки разработки для проверки до выпуска. Приложения отсюда не обновляются — только из выпуска latest."
          fi
          gh release upload android-proverka dist/QPVPN-android-proverka.apk \
            dist/android-proverka-version.txt --clobber

      - name: Обновить постоянную ссылку
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" dist/QPVPN-android.apk
          # Запасная сборка для редких старых телефонов: встанет на любой.
          cp "${{ steps.apk.outputs.universal }}" dist/QPVPN-android-universal.apk
          # Рядом с файлом кладём версию строкой: по ней приложение
          # понимает, что вышло обновление, не разбирая сам файл.
          printf '%s' "${{ steps.version.outputs.value }}" > dist/android-version.txt

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/QPVPN-android.apk \
              dist/QPVPN-android-universal.apk dist/android-version.txt --clobber
            gh release edit latest --notes-file .github/latest-notes.md
          else
            gh release create latest dist/QPVPN-android.apk \
              dist/QPVPN-android-universal.apk dist/android-version.txt \
              --target "$GITHUB_SHA" \
              --title "QP VPN — свежие сборки" \
              --notes-file .github/latest-notes.md
          fi

      - name: Опубликовать в релизе
        # Постоянные ссылки важнее архива версий: если прав на создание
        # нового выпуска нет, сборка не должна из-за этого падать.
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="android-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
              "${{ steps.apk.outputs.universal }}" --clobber
            gh release edit "$TAG" --notes-file .github/release-notes-android.md
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              "${{ steps.apk.outputs.universal }}" \
              --target "$GITHUB_SHA" \
              --title "QP VPN для Android $VERSION" \
              --notes-file .github/release-notes-android.md
          fi
          echo "Ссылка: $(gh release view "$TAG" --json url --jq .url)"

      # Постоянная ссылка: имя файла без версии, выпуск с меткой latest.
      # Её печатают в инструкциях, и она всегда ведёт на свежую сборку.

      # Отдельная сборка для эмулятора: с x86_64-библиотеками, которые из
      # сборки для людей исключены. Последней — она перезаписывает выход.
      - name: Сборка для эмулятора
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon -PqpvpnEmulator=true \
            -PqpvpnVersion="${{ steps.version.outputs.value }}"
          mkdir -p ../dist-emulator
          cp app/build/outputs/apk/release/app-universal-release.apk ../dist-emulator/QPVPN-emulator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QPVPN-emulator-apk
          path: dist-emulator/QPVPN-emulator.apk
          if-no-files-found: error

  # Проверка X-Ray на эмуляторе: свой сервер на этом же компьютере,
  # ключ ссылкой, нажатие кнопки — и запрос с телефона должен дойти до
  # сервера. Без неё «собралось» значило бы только «собралось».
  emulator:
    name: X-Ray на эмуляторе Android
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: QPVPN-emulator-apk
          path: dist

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Сервер X-Ray для проверки
        run: |
          TAG="$(git ls-remote --refs --tags https://github.com/XTLS/Xray-core.git 'v2*' | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "xray $TAG"
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/$TAG/Xray-linux-64.zip"
          mkdir -p /tmp/xray && unzip -q /tmp/xray.zip -d /tmp/xray
          UUID="$(cat /proc/sys/kernel/random/uuid)"
          echo "XRAY_UUID=$UUID" >> "$GITHUB_ENV"
          echo "SERVER_LOG=/tmp/xray-server.log" >> "$GITHUB_ENV"
          cat > /tmp/xray-server.json <<JSON
          {
            "log": {"loglevel": "info", "access": ""},
            "inbounds": [{
              "listen": "127.0.0.1", "port": 18443, "protocol": "vless",
              "settings": {"clients": [{"id": "$UUID"}], "decryption": "none"},
              "streamSettings": {"network": "tcp", "security": "none"}
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          JSON
          nohup /tmp/xray/xray run -c /tmp/xray-server.json > /tmp/xray-server.log 2>&1 &
          sleep 2
          head -5 /tmp/xray-server.log

      - name: Эмулятор и проверка
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci/check-android-xray.sh dist/QPVPN-emulator.apk
