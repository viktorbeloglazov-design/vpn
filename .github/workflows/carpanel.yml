name: panel-l9

on:
  push:
    branches: ["**"]
    paths:
      - "carpanel/**"
      - ".github/workflows/carpanel.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  apk:
    name: Сборка APK панели
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Компоненты Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Определить версию
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Тесты
        working-directory: carpanel
        run: gradle test --no-daemon --stacktrace

      - name: Сборка релизного APK
        working-directory: carpanel
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Проверяю манифест пакета
        run: |
          MANIFEST="$(find carpanel/app/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)"
          echo "манифест: $MANIFEST"
          # Без службы уведомлений не будет кнопок проигрывателя,
          # без ярлыка домашнего экрана панель нечем сделать главным экраном.
          grep -q "PanelNotificationListener" "$MANIFEST" || {
            echo "В манифесте нет службы уведомлений — кнопки музыки не заработают." >&2
            exit 1
          }
          grep -q "android.intent.category.HOME" "$MANIFEST" || {
            echo "В манифесте нет ярлыка домашнего экрана." >&2
            exit 1
          }

      - name: Подготовить файл
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          SOURCE="carpanel/app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/PanelL9-$VERSION.apk"
          echo "path=dist/PanelL9-$VERSION.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PanelL9-${{ steps.version.outputs.value }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Опубликовать в релизе
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="panel-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes-file .github/release-notes-panel.md
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --target "$GITHUB_SHA" \
              --title "Панель L9 $VERSION" \
              --notes-file .github/release-notes-panel.md
          fi
          echo "Ссылка: $(gh release view "$TAG" --json url --jq .url)"
