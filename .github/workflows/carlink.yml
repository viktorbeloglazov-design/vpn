name: carlink

on:
  push:
    branches: ["**"]
    paths:
      - "carlink/**"
      - ".github/workflows/carlink.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  apk:
    name: Сборка CarLink
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Компоненты Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Тесты
        # Ядро протокола, стенд головного устройства и сквозная проверка
        # проекции: телефон и машина поднимаются в одном процессе.
        working-directory: carlink
        run: gradle test --no-daemon --stacktrace

      - name: Сборка APK и стенда
        working-directory: carlink
        run: gradle :app:assembleRelease :headunit:installDist --no-daemon --stacktrace

      - name: Подготовить файлы
        id: files
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev"
          fi
          APK="carlink/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" "dist/CarLink-$VERSION.apk"
          # Стенд кладём рядом одним архивом: распаковал и запустил.
          (cd carlink/headunit/build/install && zip -qr "$GITHUB_WORKSPACE/dist/CarLink-headunit-$VERSION.zip" headunit)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Проверяю манифест
        run: |
          # Без подписки на строки аксессуара машина не запустит приложение,
          # а без службы переднего плана оборвётся захват экрана.
          MANIFEST="$(find carlink/app/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)"
          echo "манифест: $MANIFEST"
          grep -q "USB_ACCESSORY_ATTACHED" "$MANIFEST" || { echo "нет подписки на подключение к машине" >&2; exit 1; }
          grep -q "mediaProjection" "$MANIFEST" || { echo "нет службы захвата экрана" >&2; exit 1; }
          grep -q "BIND_ACCESSIBILITY_SERVICE" "$MANIFEST" || { echo "нет службы нажатий" >&2; exit 1; }
          echo "--- строки аксессуара ---"
          grep -o 'model="[^"]*"' carlink/app/src/main/res/xml/usb_accessory_filter.xml

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: CarLink-headunit
          path: dist/*.zip
          if-no-files-found: error

      - name: Опубликовать в релизе
        # Релиз нужен ради прямой ссылки: артефакт сборки качается архивом и
        # только из-под входа, а с телефона так не поставишь.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.files.outputs.version }}"
          TAG="carlink-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file .github/release-notes-carlink.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "CarLink $VERSION" \
              --notes-file .github/release-notes-carlink.md
          fi
          echo "Ссылка: $(gh release view "$TAG" --json url --jq .url)"
