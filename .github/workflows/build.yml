name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos:
    name: Сборка под macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Версия Swift
        run: swift --version

      - name: Сборка (release)
        run: swift build -c release

      - name: Тесты ядра
        run: swift test

      - name: Сборка бандла приложения
        run: |
          ./scripts/build.sh
          test -x "dist/KupibasVPN.app/Contents/MacOS/KupibasVPN"
          test -x "dist/KupibasVPN.app/Contents/Library/Helpers/kupibasvpnd"
          test -x "dist/KupibasVPN.app/Contents/Resources/install-helper.sh"

      - name: Проверка синтаксиса скриптов
        run: |
          for f in scripts/*.sh server/*.sh; do
            bash -n "$f"
          done
