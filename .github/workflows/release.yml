name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  dmg:
    name: Образ для скачивания
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Определить версию
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION"

      - name: Собрать утилиты WireGuard
        run: ./scripts/ci/build-wireguard.sh "$RUNNER_TEMP/wg-tools"

      - name: Собрать приложение (universal)
        run: ./scripts/build.sh --universal --tools "$RUNNER_TEMP/wg-tools"

      - name: Проверить бандл
        run: |
          APP="dist/QPVPN.app"
          test -x "$APP/Contents/MacOS/QPVPN"
          test -f "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Resources/install-helper.sh"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/PkgInfo"
          test -f "$APP/Contents/Resources/kupibas-logo-on-light.png"
          test -f "$APP/Contents/Resources/kupibas-logo-on-dark.png"
          # Приложение должно хотя бы стартовать: проверяем, что бинарник
          # запускается и отвечает системе, а не падает сразу.
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/com.kupibas.vpn.helper.plist"
          for tool in kupibasvpnd amneziawg-go awg wireguard-go wg; do
            test -x "$APP/Contents/Library/Helpers/$tool"
          done
          echo "Архитектуры приложения: $(lipo -archs "$APP/Contents/MacOS/QPVPN")"
          echo "Архитектуры службы:     $(lipo -archs "$APP/Contents/Library/Helpers/kupibasvpnd")"
          codesign --verify --strict "$APP"

      - name: Проверить, что приложение запускается
        run: |
          APP="$PWD/dist/QPVPN.app"
          LOG="$HOME/Library/Logs/QPVPN.log"
          rm -f "$LOG"

          open "$APP"
          sleep 10

          if pgrep -f "QPVPN.app/Contents/MacOS/QPVPN" > /dev/null; then
            echo "Приложение запущено и держится в памяти."
            echo "--- журнал запуска ---"
            cat "$LOG" 2>/dev/null || echo "(журнал пуст)"
            pkill -f "QPVPN.app/Contents/MacOS/QPVPN" || true
          else
            echo "Приложение не осталось в памяти — запуск оборвался." >&2
            echo "--- журнал запуска ---" >&2
            cat "$LOG" 2>/dev/null || echo "(журнал пуст)" >&2
            echo "--- отчёты о падении ---" >&2
            ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -3 >&2 || true
            find "$HOME/Library/Logs/DiagnosticReports" -name "QPVPN*" -mmin -5 -exec head -40 {} \; 2>/dev/null >&2 || true
            exit 1
          fi

      - name: Собрать DMG
        run: ./scripts/make-dmg.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: QPVPN-${{ steps.version.outputs.value }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
            gh release edit "$TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" dist/*.dmg \
              --target "$GITHUB_SHA" \
              --title "QP VPN для Mac $VERSION" \
              --notes-file .github/release-notes.md
          fi
          echo "Ссылка на релиз: $(gh release view "$TAG" --json url --jq .url)"

      # Постоянная ссылка: имя файла без версии, выпуск с меткой latest.
      - name: Обновить постоянную ссылку
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/QPVPN-"${{ steps.version.outputs.value }}".dmg dist/QPVPN-mac.dmg
          printf '%s' "${{ steps.version.outputs.value }}" > dist/mac-version.txt

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/QPVPN-mac.dmg dist/mac-version.txt --clobber
            gh release edit latest --notes-file .github/latest-notes.md
          else
            gh release create latest dist/QPVPN-mac.dmg dist/mac-version.txt \
              --target "$GITHUB_SHA" \
              --title "QP VPN — свежие сборки" \
              --notes-file .github/latest-notes.md
          fi
