name: awg-probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Сборка библиотеки AmneziaWG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Клонирую amneziawg-android
        run: |
          # Исходники awg-go и awg-tools лежат в подмодулях — без них CMake
          # не находит ни одного файла для сборки.
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/amnezia-vpn/amneziawg-android.git "$RUNNER_TEMP/awg"
          cd "$RUNNER_TEMP/awg"
          echo "--- состав репозитория ---"
          ls
          echo "--- модули ---"
          cat settings.gradle* 2>/dev/null || true
          echo "--- версия из gradle.properties ---"
          cat gradle.properties 2>/dev/null | head -20 || true
          echo "--- подмодули ---"
          git submodule status || true
          ls tunnel/tools/ 2>/dev/null || true

      - name: Компоненты Android SDK и NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Собираю AAR
        run: |
          cd "$RUNNER_TEMP/awg"
          chmod +x gradlew 2>/dev/null || true
          set +e
          ./gradlew :tunnel:assembleRelease --no-daemon > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "=== Gradle упал, код $STATUS ==="
            echo "--- что именно пошло не так ---"
            sed -n "/What went wrong/,/Try:/p" "$RUNNER_TEMP/build.log" | head -40
            echo "--- строки с ошибками ---"
            grep -iE "error|failed|not found|unsupported|requires" "$RUNNER_TEMP/build.log" | grep -v "^\s*at " | head -25
            echo "--- последние строки ---"
            grep -v "^\s*at " "$RUNNER_TEMP/build.log" | tail -25
            exit 1
          fi
          echo "Сборка прошла"
          echo "--- какие классы внутри ---"
          AAR="$(find "$RUNNER_TEMP/awg" -name "*.aar" | head -1)"
          unzip -o -q "$AAR" -d "$RUNNER_TEMP/aar-unpacked"
          cd "$RUNNER_TEMP/aar-unpacked"
          ls
          unzip -l classes.jar | grep -E "backend/GoBackend|config/Config|backend/Tunnel|config/Interface" | head -20
          echo "--- нативные библиотеки ---"
          find jni -name "*.so" -exec ls -lh {} \; 2>/dev/null | head

      - name: Что получилось
        run: |
          find "$RUNNER_TEMP/awg" -name "*.aar" -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: awg-tunnel-aar
          path: ${{ runner.temp }}/awg/tunnel/build/outputs/aar/*.aar
          if-no-files-found: warn
