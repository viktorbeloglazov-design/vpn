name: opisanie

# Описание выпуска «latest» — то, что человек читает на странице загрузки.
# Раньше оно обновлялось только вместе с выпуском приложения, поэтому
# успело устареть: отправляло ставить на Windows чужой клиент, хотя наше
# приложение лежало в том же выпуске. Теперь правка в файле доезжает
# до страницы сама.

on:
  push:
    branches: ["**"]
    paths:
      - ".github/latest-notes.md"
      - ".github/workflows/opisanie.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    name: Описание выпуска
    runs-on: ubuntu-latest
    if: github.ref_name == 'claude/mac-vpn-app-routes-7jv8o7' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Обновить описание
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit latest --notes-file .github/latest-notes.md

      - name: Убедиться, что доехало
        run: bash scripts/ci/check-opisanie.sh
