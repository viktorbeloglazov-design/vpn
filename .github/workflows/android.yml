name: android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Компоненты Android SDK
        run: |
          # На раннере SDK уже стоит: пользуемся им напрямую, потому что
          # setup-android тянет пакет tools, которого больше не существует.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Версия библиотеки AmneziaWG
        id: awg
        run: |
          SHA="$(git ls-remote https://github.com/amnezia-vpn/amneziawg-android HEAD | cut -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "AmneziaWG: $SHA"

      - name: Библиотека AmneziaWG из кэша
        id: awg-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/awg-tunnel.aar
          key: awg-aar-${{ steps.awg.outputs.sha }}

      - name: Собираю библиотеку AmneziaWG
        if: steps.awg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-awg.sh android/app/libs/awg-tunnel.aar

      - name: Проверяю библиотеку
        run: |
          AAR="android/app/libs/awg-tunnel.aar"
          if [ ! -f "$AAR" ]; then
            echo "Библиотека не появилась по пути $AAR" >&2
            find . -name "*.aar" | head >&2
            exit 1
          fi
          ls -lh "$AAR"
          echo "--- содержимое ---"
          unzip -l "$AAR" | grep -E "classes|\.so" | head -10 || true

      - name: Определить версию
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Тесты
        working-directory: android
        run: gradle test --no-daemon --stacktrace

      - name: Сборка релизного APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Проверяю манифест пакета
        run: |
          # Без объявленной службы VPN туннель не поднимется — проверяем,
          # что библиотека AmneziaWG принесла её в собранный манифест.
          MANIFEST="$(find android/app/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)"
          echo "манифест: $MANIFEST"
          echo "--- службы VPN ---"
          grep -o 'android:name="[^"]*VpnService"' "$MANIFEST" | sort -u
          if ! grep -q "BIND_VPN_SERVICE" "$MANIFEST"; then
            echo "В манифесте нет разрешения BIND_VPN_SERVICE — туннель не заработает." >&2
            exit 1
          fi
          echo "--- приём ссылок vpn:// ---"
          grep -o 'android:scheme="vpn"' "$MANIFEST" | head -1

      - name: Подготовить файл
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/QPVPN-$VERSION.apk"
          echo "path=dist/QPVPN-$VERSION.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: QPVPN-${{ steps.version.outputs.value }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Опубликовать в релизе
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="android-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes-file .github/release-notes-android.md
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --target "$GITHUB_SHA" \
              --title "QP VPN для Android $VERSION" \
              --notes-file .github/release-notes-android.md
          fi
          echo "Ссылка: $(gh release view "$TAG" --json url --jq .url)"

      # Постоянная ссылка: имя файла без версии, выпуск с меткой latest.
      # Её печатают в инструкциях, и она всегда ведёт на свежую сборку.
      - name: Обновить постоянную ссылку
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" dist/QPVPN-android.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/QPVPN-android.apk --clobber
            gh release edit latest --notes-file .github/latest-notes.md
          else
            gh release create latest dist/QPVPN-android.apk \
              --target "$GITHUB_SHA" \
              --title "QP VPN — свежие сборки" \
              --notes-file .github/latest-notes.md
          fi
